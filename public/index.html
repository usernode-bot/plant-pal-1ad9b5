<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return (val.stack || (val.name + ': ' + val.message));
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Plant Pal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 8C68 31 86 51 86 68a36 36 0 0 1-72 0C14 51 32 31 50 8Z' fill='%2315803d'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       (bg-ground, text-muted, bg-accent, ...) that are right in both looks,
       and components (btn-primary, list, card, state-empty, ...). CLAUDE.md's
       "## Design" says how. -->
  <main class="mx-auto flex max-w-md flex-col gap-8 px-4 py-10">
    <h1 class="text-title">Plant Pal</h1>

    <!-- Anything that loads data shows exactly one of these at a time:
         loading, the data, empty (it loaded, and there is nothing yet)
         or error (it did not load). The script below switches them. -->
    <div id="plants-loading" role="status">
      <span class="sr-only">Loading your plants</span>
      <div class="list">
        <div class="list-row"><div class="skeleton h-4 w-1/2"></div></div>
        <div class="list-row"><div class="skeleton h-4 w-1/3"></div></div>
        <div class="list-row"><div class="skeleton h-4 w-2/5"></div></div>
      </div>
    </div>
    <div id="plants-error" class="state-error" hidden>
      <svg class="h-6 w-6 text-danger" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a1 1 0 0 1 1 1v4a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/></svg>
      <p class="text-heading">Couldn't load your plants</p>
      <p class="text-body text-muted">Nothing was lost. Your plants and watering history are safe. Try again.</p>
      <button id="plants-retry" class="btn-secondary">Retry</button>
    </div>
    <div id="plants-empty" class="state-empty" hidden>
      <p class="text-heading">No plants yet</p>
      <p class="text-body text-muted">Add your first plant below to start its watering schedule.</p>
      <button id="plants-empty-add" class="btn-secondary">Add plant</button>
    </div>

    <div id="plants-view" hidden>
      <section id="today-section" hidden>
        <h2 class="section-label">Needs water today</h2>
        <ul id="today-list" class="list"></ul>
      </section>
      <section id="all-section" class="mt-6" hidden>
        <h2 class="section-label">All plants</h2>
        <ul id="all-list" class="list"></ul>
      </section>
    </div>

    <form id="add-form" class="card flex flex-col gap-4" novalidate>
      <h2 class="text-heading">Add plant</h2>
      <div class="flex flex-col gap-1">
        <label for="add-name" class="text-small text-muted">Plant name</label>
        <input id="add-name" class="field" type="text" maxlength="255" autocomplete="off" placeholder="e.g. Fern">
      </div>
      <div class="flex flex-col gap-1">
        <label for="add-interval" class="text-small text-muted">Watering interval (in days)</label>
        <input id="add-interval" class="field" type="number" min="1" max="365" step="1" inputmode="numeric" value="7">
      </div>
      <p id="add-error" class="text-small text-danger" hidden></p>
      <button id="add-submit" type="submit" class="btn-secondary">Add plant</button>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};
    // Staging previews pass ?demo=1 for obviously fake plants; pass it
    // through so the populated screen can be reviewed.
    const demoQuery = params.get('demo') === '1' ? '?demo=1' : '';

    // The plant list's states, one shown at a time. Empty only when the
    // load worked and found nothing; a failure is the error state, never
    // "No plants yet".
    const views = {
      loading: document.getElementById('plants-loading'),
      view: document.getElementById('plants-view'),
      empty: document.getElementById('plants-empty'),
      error: document.getElementById('plants-error'),
    };
    function show(name) {
      for (const [key, el] of Object.entries(views)) el.hidden = key !== name;
    }

    // The signature element: a small drop beside each plant. Static markup
    // only — plant names go in as text below, never as HTML.
    const DROP_ICONS = {
      filled: '<svg viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5 shrink-0 text-accent" aria-hidden="true"><path d="M10 2.3c2.6 3.2 5.5 6.6 5.5 9.7a5.5 5.5 0 1 1-11 0C4.5 8.9 7.4 5.5 10 2.3Z"/></svg>',
      outline: '<svg viewBox="0 0 20 20" class="h-5 w-5 shrink-0 text-muted" aria-hidden="true"><path d="M10 2.3c2.6 3.2 5.5 6.6 5.5 9.7a5.5 5.5 0 1 1-11 0C4.5 8.9 7.4 5.5 10 2.3Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
      checked: '<svg viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5 shrink-0 text-accent" aria-hidden="true"><path d="M10 2.3c2.6 3.2 5.5 6.6 5.5 9.7a5.5 5.5 0 1 1-11 0C4.5 8.9 7.4 5.5 10 2.3Z"/><path class="text-on-accent" d="m7.3 12.3 1.9 1.9 3.5-3.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    };

    // Words and colours for each server-computed status.
    function statusOf(plant) {
      if (plant.status === 'due-today') return { icon: 'filled', label: 'Due today' };
      if (plant.status === 'watered-recently') return { icon: 'checked', label: 'Watered recently' };
      const n = plant.due_in_days;
      return { icon: 'outline', label: 'Due in ' + n + (n === 1 ? ' day' : ' days') };
    }

    // Short weekday names for the "Watered Tue" line, in the viewer's
    // local time.
    const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function lastWateredText(plant) {
      if (!plant.last_watered_at) return 'Never watered';
      const watered = new Date(plant.last_watered_at);
      const now = new Date();
      // Same calendar day reads "Watered today"; otherwise the weekday of
      // the day it was watered.
      const sameDay = watered.getFullYear() === now.getFullYear()
        && watered.getMonth() === now.getMonth()
        && watered.getDate() === now.getDate();
      return sameDay ? 'Watered today' : 'Watered ' + WEEKDAYS[watered.getDay()];
    }

    function dropEl(icon) {
      const span = document.createElement('span');
      span.innerHTML = DROP_ICONS[icon];
      return span;
    }

    function todayRow(plant) {
      const li = document.createElement('li');
      li.className = 'list-row items-start';
      const text = document.createElement('div');
      const name = document.createElement('p');
      name.className = 'text-body font-medium';
      name.textContent = plant.name;
      const since = document.createElement('p');
      since.className = 'text-small text-muted';
      since.textContent = lastWateredText(plant);
      text.append(name, since);
      // Watering stays the primary action; Delete is the quieter secondary
      // one, stacked beneath it.
      const actions = document.createElement('div');
      actions.className = 'flex flex-col gap-2';
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn-primary';
      button.textContent = 'Mark watered';
      button.addEventListener('click', () => waterPlant(plant, button));
      actions.append(button, deleteButton(plant));
      li.append(dropEl('filled'), text, actions);
      return li;
    }

    function allRow(plant) {
      const li = document.createElement('li');
      li.className = 'list-row items-start';
      const text = document.createElement('div');
      const name = document.createElement('p');
      name.className = 'text-body font-medium';
      name.textContent = plant.name;
      const state = statusOf(plant);
      const line = document.createElement('p');
      line.className = 'text-small text-muted';
      // Never-watered plants keep the status label alone; a watered one
      // gains the weekday, e.g. "Due in 5 days · Watered Tue".
      line.textContent = state.label + (plant.last_watered_at ? ' · ' + lastWateredText(plant) : '');
      text.append(name, line);
      li.append(dropEl(state.icon), text, deleteButton(plant));
      return li;
    }

    // Delete with a two-tap confirm: the first tap arms the button for a
    // few seconds, only a second tap inside that window removes the plant.
    function deleteButton(plant) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn-secondary';
      button.textContent = 'Delete';
      let timer = null;
      function disarm() {
        if (timer) clearTimeout(timer);
        timer = null;
        button.textContent = 'Delete';
      }
      button.addEventListener('click', () => {
        if (!timer) {
          button.textContent = 'Confirm delete';
          timer = setTimeout(disarm, 4000);
          return;
        }
        disarm();
        deletePlant(plant);
      });
      return button;
    }

    async function deletePlant(plant) {
      try {
        const res = await fetch('/api/plants/' + plant.id, { method: 'DELETE', headers });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        // The list reloads without a page refresh: a deleted due-today
        // plant leaves the today group, deleting the last one shows the
        // empty state.
        loadPlants();
      } catch {
        // A failed delete (a staging demo plant, a network error) is
        // silent: the button is back to "Delete" and the plant stays.
      }
    }

    function render(plants) {
      if (!plants.length) { show('empty'); return; }
      const due = plants.filter(p => p.status === 'due-today');
      const rest = plants.filter(p => p.status !== 'due-today');
      document.getElementById('today-section').hidden = !due.length;
      document.getElementById('today-list').replaceChildren(...due.map(todayRow));
      document.getElementById('all-section').hidden = !rest.length;
      document.getElementById('all-list').replaceChildren(...rest.map(allRow));
      show('view');
    }

    async function loadPlants() {
      show('loading');
      let plants;
      try {
        const res = await fetch('/api/plants' + demoQuery, { headers });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        ({ plants } = await res.json());
      } catch {
        show('error');
        return;
      }
      render(plants);
    }

    async function waterPlant(plant, button) {
      button.disabled = true;
      try {
        const res = await fetch('/api/plants/' + plant.id + '/water', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        // The list reloads without a page refresh: the plant moves out of
        // the today group as watered recently.
        loadPlants();
      } catch {
        button.disabled = false;
      }
    }

    // Delete cannot be undone, so the first tap only arms the button; the
    // second, within three seconds, deletes. Disarm back to plain "Delete"
    // if the person taps nothing or the request fails.
    function disarmDelete(button) {
      delete button.dataset.armed;
      button.textContent = 'Delete';
      button.classList.remove('text-danger');
    }

    async function deletePlant(plant, button) {
      button.disabled = true;
      try {
        const res = await fetch('/api/plants/' + plant.id, { method: 'DELETE', headers });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        // The list reloads without a page refresh: the row disappears.
        loadPlants();
      } catch {
        button.disabled = false;
        disarmDelete(button);
      }
    }

    function deleteButton(plant) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn-secondary';
      button.textContent = 'Delete';
      button.addEventListener('click', () => {
        if (button.dataset.armed) {
          deletePlant(plant, button);
          return;
        }
        button.dataset.armed = '1';
        button.textContent = 'Confirm delete';
        button.classList.add('text-danger');
        setTimeout(() => disarmDelete(button), 3000);
      });
      return button;
    }

    const addForm = document.getElementById('add-form');
    const addName = document.getElementById('add-name');
    const addInterval = document.getElementById('add-interval');
    const addError = document.getElementById('add-error');
    const addSubmit = document.getElementById('add-submit');

    function showAddError(message) {
      addError.textContent = message;
      addError.hidden = false;
    }

    addForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      addError.hidden = true;
      const name = addName.value.trim();
      const interval = addInterval.value === '' ? undefined : Number(addInterval.value);
      if (!name) return showAddError('Give the plant a name first.');
      if (interval !== undefined && (!Number.isInteger(interval) || interval < 1 || interval > 365)) {
        return showAddError('Watering interval must be a whole number of days between 1 and 365.');
      }
      addSubmit.disabled = true;
      try {
        const res = await fetch('/api/plants', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ name, water_every_days: interval }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not add the plant');
        addName.value = '';
        addInterval.value = '7';
        loadPlants();
      } catch (err) {
        showAddError(err.message);
      } finally {
        addSubmit.disabled = false;
      }
    });

    document.getElementById('plants-retry').addEventListener('click', loadPlants);
    document.getElementById('plants-empty-add').addEventListener('click', () => {
      addName.focus();
    });

    loadPlants();
  </script>
</body>
</html>
