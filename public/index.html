<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return (val.stack || (val.name + ': ' + val.message));
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Plant Pal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 6C27 34 14 54 14 70a36 36 0 0 0 72 0C86 54 73 34 50 6Z' fill='%2315803d'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main class="mx-auto flex max-w-md flex-col gap-8 px-4 py-10">

    <header class="px-1">
      <h1 class="text-title">Plant Pal</h1>
      <p id="today-count" class="text-small text-muted"></p>
    </header>

    <!-- Anything that loads data shows exactly one of these at a time:
         loading, the data (the two lists below), empty or error. -->
    <div id="plants-loading" role="status">
      <span class="sr-only">Loading your plants</span>
      <div class="list">
        <div class="list-row"><div class="skeleton h-4 w-2/5"></div></div>
        <div class="list-row"><div class="skeleton h-4 w-1/2"></div></div>
        <div class="list-row"><div class="skeleton h-4 w-1/3"></div></div>
      </div>
    </div>

    <div id="plants-error" class="state-error" hidden>
      <svg class="h-6 w-6 text-danger" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a1 1 0 0 1 1 1v4a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/></svg>
      <p class="text-heading">Couldn't load your plants</p>
      <p class="text-body text-muted">Your plants are saved and untouched — the list just failed to load.</p>
      <button id="plants-retry" class="btn-secondary">Retry</button>
    </div>

    <div id="plants-empty" class="state-empty" hidden>
      <p class="text-heading">No plants yet</p>
      <p class="text-body text-muted">Add your first plant to start tracking when it needs water.</p>
      <button id="empty-add" class="btn-secondary">Add a plant</button>
    </div>

    <section id="today-section" hidden>
      <h2 class="section-label">Needs water today</h2>
      <ul id="today-list" class="list"></ul>
      <p id="water-error" class="mt-2 px-1 text-small text-danger" hidden></p>
    </section>

    <section id="all-section" hidden>
      <h2 class="section-label">All plants</h2>
      <ul id="all-list" class="list"></ul>
    </section>

    <section class="card">
      <h2 class="section-label">Add plant</h2>
      <form id="add-form" class="flex flex-col gap-3">
        <div>
          <label for="plant-name" class="mb-1 block text-small font-medium">Plant name</label>
          <input id="plant-name" class="field" type="text" maxlength="255" required autocomplete="off" placeholder="e.g. Monstera">
        </div>
        <div>
          <label for="plant-interval" class="mb-1 block text-small font-medium">Watering interval</label>
          <input id="plant-interval" class="field" type="number" min="1" max="365" step="1" value="7" inputmode="numeric">
          <p class="mt-1 text-small text-muted">Days between waterings</p>
        </div>
        <button type="submit" id="add-btn" class="btn-primary">Add plant</button>
        <p id="add-error" class="text-small text-danger" hidden></p>
      </form>
    </section>

  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      // Forward the staging demo flag to the API (read-only fake plants;
      // see server.js). It only ever matters in staging.
      const apiQuery = params.get('demo') === '1' ? '?demo=1' : '';
      const apiHeaders = token ? { 'x-usernode-token': token } : {};

      const el = {
        count: document.getElementById('today-count'),
        loading: document.getElementById('plants-loading'),
        error: document.getElementById('plants-error'),
        empty: document.getElementById('plants-empty'),
        todaySection: document.getElementById('today-section'),
        todayList: document.getElementById('today-list'),
        allSection: document.getElementById('all-section'),
        allList: document.getElementById('all-list'),
        waterError: document.getElementById('water-error'),
        retry: document.getElementById('plants-retry'),
        emptyAdd: document.getElementById('empty-add'),
        addForm: document.getElementById('add-form'),
        addName: document.getElementById('plant-name'),
        addInterval: document.getElementById('plant-interval'),
        addBtn: document.getElementById('add-btn'),
        addError: document.getElementById('add-error'),
      };

      const DAY_MS = 24 * 60 * 60 * 1000;
      let plants = [];

      function daysSince(iso, now) {
        return Math.floor((now - new Date(iso).getTime()) / DAY_MS);
      }

      // One place computes a plant's watering state, from the viewer's local
      // clock: watered less than 24 hours ago is "Watered recently", never
      // watered or at/past the interval is due today.
      function status(plant, now) {
        if (!plant.lastWateredAt) return { due: true, label: 'Due today' };
        const days = daysSince(plant.lastWateredAt, now);
        if (days <= 0) return { due: false, label: 'Watered recently' };
        if (days >= plant.wateringIntervalDays) return { due: true, label: 'Due today' };
        return { due: false, label: 'Due in ' + (plant.wateringIntervalDays - days) + ' days' };
      }

      function lastWateredLine(plant, now) {
        if (!plant.lastWateredAt) return 'Never watered';
        const days = Math.max(0, daysSince(plant.lastWateredAt, now));
        if (days === 0) return 'Watered today';
        if (days === 1) return 'Watered yesterday';
        return 'Last watered ' + days + ' days ago';
      }

      // The water drop, this app's signature: accent-coloured when the plant
      // is due, muted when it is not. Both class strings are whole literals,
      // so the precompiled stylesheet carries both looks.
      function dropSvg(due) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 20 20');
        svg.setAttribute('fill', 'currentColor');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('class', due
          ? 'mt-0.5 h-5 w-5 shrink-0 text-accent'
          : 'mt-0.5 h-5 w-5 shrink-0 text-muted');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M10 1.5c-3.3 3.9-5.75 7.1-5.75 10.3a5.75 5.75 0 0 0 11.5 0C15.75 8.6 13.3 5.4 10 1.5Z');
        svg.appendChild(path);
        return svg;
      }

      function nameBlock(plant, subLine) {
        const wrap = document.createElement('div');
        wrap.className = 'min-w-0 flex-1';
        const name = document.createElement('p');
        name.className = 'truncate text-body font-medium';
        name.textContent = plant.name;
        const sub = document.createElement('p');
        sub.className = 'text-small text-muted';
        sub.textContent = subLine;
        wrap.append(name, sub);
        return wrap;
      }

      function todayRow(plant, now) {
        const li = document.createElement('li');
        li.className = 'list-row';
        const button = document.createElement('button');
        button.className = 'btn-primary shrink-0 px-3 text-small';
        button.textContent = 'Mark watered';
        button.addEventListener('click', async () => {
          button.disabled = true;
          el.waterError.hidden = true;
          try {
            const res = await fetch('/api/plants/' + plant.id + '/water', {
              method: 'POST',
              headers: apiHeaders,
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            await loadPlants();
          } catch {
            button.disabled = false;
            el.waterError.textContent = 'Could not mark ' + plant.name + ' watered. Your plants are unchanged — try again.';
            el.waterError.hidden = false;
          }
        });
        li.append(dropSvg(true), nameBlock(plant, lastWateredLine(plant, now)), button);
        return li;
      }

      function allRow(plant, now) {
        const li = document.createElement('li');
        li.className = 'list-row';
        const s = status(plant, now);
        li.append(dropSvg(s.due), nameBlock(plant, s.label));
        return li;
      }

      function render() {
        const now = Date.now();
        el.todayList.replaceChildren(...plants.filter(p => status(p, now).due).map(p => todayRow(p, now)));
        el.allList.replaceChildren(...plants.map(p => allRow(p, now)));
        const dueCount = el.todayList.children.length;
        el.count.textContent =
          plants.length === 0 ? '' :
          dueCount === 0 ? 'All watered today' :
          dueCount === 1 ? '1 plant needs water today' :
          dueCount + ' plants need water today';
        setPane(plants.length ? 'data' : 'empty');
      }

      // Exactly one pane (loading, data, empty, error) visible at a time;
      // within the data pane the "today" section disappears when the group
      // is empty rather than showing an empty list.
      function setPane(name) {
        el.loading.hidden = name !== 'loading';
        el.error.hidden = name !== 'error';
        el.empty.hidden = name !== 'empty';
        const data = name === 'data';
        el.todaySection.hidden = !data || el.todayList.children.length === 0;
        el.allSection.hidden = !data;
      }

      async function loadPlants(opts = {}) {
        if (opts.showLoading) setPane('loading');
        let data;
        try {
          const res = await fetch('/api/plants' + apiQuery, { headers: apiHeaders });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          data = await res.json();
        } catch {
          setPane('error');
          return;
        }
        plants = Array.isArray(data.plants) ? data.plants : [];
        render();
      }

      el.retry.addEventListener('click', () => loadPlants({ showLoading: true }));

      el.emptyAdd.addEventListener('click', () => {
        el.addForm.scrollIntoView({ block: 'center' });
        el.addName.focus();
      });

      el.addForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        el.addError.hidden = true;
        const name = el.addName.value.trim();
        if (!name) return;
        const interval = el.addInterval.value === '' ? 7 : Number(el.addInterval.value);
        el.addBtn.disabled = true;
        try {
          const res = await fetch('/api/plants', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...apiHeaders },
            body: JSON.stringify({ name, wateringIntervalDays: interval }),
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          el.addName.value = '';
          el.addInterval.value = '7';
          await loadPlants();
        } catch {
          el.addError.textContent = 'Could not add the plant. Nothing was saved — try again.';
          el.addError.hidden = false;
        } finally {
          el.addBtn.disabled = false;
        }
      });

      loadPlants({ showLoading: true });
    })();
  </script>
</body>
</html>
